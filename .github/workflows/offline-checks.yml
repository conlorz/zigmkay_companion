name: Offline source checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0
      - name: Verify Zig version
        run: test "$(zig version)" = 0.17.0
      - name: Test portable contracts (no device access)
        run: zig build test
      - name: Check source contracts (no device access)
        run: zig build check
