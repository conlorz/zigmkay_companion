name: Offline source checks

on:
  push:
    branches: [omos/ci-repair]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0
      - name: Verify Zig version
        run: test "$(zig version)" = 0.17.0
      - name: Install xkbcommon development library
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Compare exact Linux fixture directory shapes
        timeout-minutes: 2
        run: zig test packages/jobs/src/source_files.zig --test-filter fixture
      - name: Check source contracts first (no device access)
        timeout-minutes: 10
        run: zig build check -j2 --test-timeout 30s
      - name: Test nested source traversal before the complete matrix
        timeout-minutes: 2
        run: zig test packages/jobs/src/source_files.zig --test-filter nested
      - name: Capture blocked standalone test backtrace
        timeout-minutes: 2
        run: |
          sudo apt-get install -y gdb
          zig test packages/jobs/src/package_cache.zig --test-filter 'POSIX colon' --test-no-exec -femit-bin="$RUNNER_TEMP/package-colon-test"
          "$RUNNER_TEMP/package-colon-test" > "$RUNNER_TEMP/colon.out" 2>&1 &
          test_pid=$!
          sleep 3
          if kill -0 "$test_pid" 2>/dev/null; then
            sudo gdb -q -batch -p "$test_pid" -ex 'set pagination off' -ex 'thread 1' -ex 'bt 8' -ex 'frame 0' -ex 'p a.len' -ex 'p b.len' -ex 'frame 2' -ex 'p name.len' -ex 'frame 3' -ex 'p item.name.len' -ex 'p path.len' -ex detach > "$RUNNER_TEMP/colon.bt" 2>&1 || true
            printf 'numeric slice lengths and blocked stack:\n'
            grep -E '^#[0-9]+ |^\$[0-9]+ = |^Thread ' "$RUNNER_TEMP/colon.bt" | head -n 70 || true
            kill "$test_pid" 2>/dev/null || true
            wait "$test_pid" 2>/dev/null || true
            exit 1
          fi
          wait "$test_pid"
      - name: Diagnose Linux fixture cleanup and traversal
        timeout-minutes: 2
        run: zig build test-jobs -j1 --test-timeout 10s --summary failures
      - name: Test portable contracts (no device access)
        timeout-minutes: 15
        run: zig build test -j2 --test-timeout 45s
