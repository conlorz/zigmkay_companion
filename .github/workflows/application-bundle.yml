name: Self-contained application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Windows finalization diagnostic, Windows GUI verification, or full bundle verification
        type: choice
        options: [diagnostic, gui, full]
        default: diagnostic

permissions:
  contents: read

jobs:
  windows-finalization:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnostic'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0
          cache-size-limit: 4096
      - name: Build only the symbolized finalization reproduction
        run: zig build build-finalization-diagnostic -Dfinalization-diagnostic-only=true -j2 --summary all
      - name: Reproduce artifact publication without firmware compilation or devices
        shell: pwsh
        run: |
          & ./zig-out/bin/diagnose-build-finalization.exe "$env:RUNNER_TEMP/finalization ü" 2>&1 | Tee-Object -FilePath finalization.log
          exit $LASTEXITCODE
      - name: Preserve exact executable, PDB and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-finalization-${{ github.sha }}
          retention-days: 3
          path: |
            zig-out/bin/diagnose-build-finalization*
            finalization.log
            ${{ runner.temp }}/finalization ü
  bundle:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'gui'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.mode == 'gui' && '["windows-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0
          # Windows exceeded the default 2 GiB limit and saved an empty cache.
          cache-size-limit: 4096
      - name: Check subprocess timeout and cancellation (no devices)
        run: zig build test-subprocess -j2 --test-timeout 30s --summary all
      - name: Assemble all runtime inputs
        run: zig build bundle-application build-bundle-check -Dapplication-bundle=true -Ddesktop-dependencies=true -Ddesktop-vectors=true -j2 --summary all
      - name: Relocated macOS offline builds and practice
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          target="$RUNNER_TEMP/Zigmkay offline ü"
          mkdir -p "$target/home"
          cp -R zig-out/Zigmkay.app "$target/"
          cp zig-out/bin/check-application-bundle "$target/check"
          chmod -R a-w "$target/Zigmkay.app"
          profile="(version 1)(allow default)(deny network*)(deny file-read* (subpath \"$GITHUB_WORKSPACE\"))(deny file-read* (subpath \"$RUNNER_TOOL_CACHE\"))(deny file-read* (subpath \"/Applications/Xcode.app\"))(deny file-read* (subpath \"/Library/Developer\"))"
          cd "$target"
          for pass in cold warm; do
            echo "Offline bundle verification: $pass"
            env -i HOME="$target/home" PATH=/usr/bin:/bin SDKROOT=/missing DEVELOPER_DIR=/missing ZIG_LOCAL_PKG_DIR=/missing \
              sandbox-exec -p "$profile" ./check "$target/Zigmkay.app/Contents/Resources" "$target/home/Library/Caches/zigmkay" all
          done
          env -i HOME="$target/home" PATH=/usr/bin:/bin SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software \
            sandbox-exec -p "$profile" "$target/Zigmkay.app/Contents/MacOS/zigmkay-companion" --offline-build-frames 30000
      - name: Single Windows executable builds and practice
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Zigmkay offline ü'
          New-Item -ItemType Directory -Force "$target/install", "$target/home", "$target/config", "$target/cache" | Out-Null
          Copy-Item zig-out/Zigmkay.exe "$target/install/Zigmkay.exe"
          Copy-Item zig-out/bin/check-application-bundle.exe "$target/check.exe"
          $env:HOME = "$target/home"
          $env:APPDATA = "$target/config"
          $env:LOCALAPPDATA = "$target/cache"
          $env:ZIG_LOCAL_PKG_DIR = 'C:\missing'
          $env:ZIG_LIB_DIR = 'C:\missing'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Set-Location $target
          if ('${{ inputs.mode }}' -ne 'gui') {
            & ./check.exe "$target/install/Zigmkay.exe" "$target/cache/zigmkay/cache" all
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & ./check.exe "$target/install/Zigmkay.exe" "$target/cache/zigmkay/cache" all
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_RENDER_DRIVER = 'software'
          & "$target/install/Zigmkay.exe" --offline-build-frames 30000
          exit $LASTEXITCODE
