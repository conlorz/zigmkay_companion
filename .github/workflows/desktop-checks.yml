name: Native desktop contracts

on:
  push:
  pull_request:

jobs:
  desktop:
    # Temporary PR #4 diagnostic gate. Restore automatic coverage before merge.
    if: github.ref != 'refs/heads/t3code/review-dependency-configuration' && github.head_ref != 't3code/review-dependency-configuration'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0
      - name: Verify compiler
        run: test "$(zig version)" = 0.17.0
      - name: Compile and link the native editor, DVUI, SDL3 and tray
        run: zig build build-desktop check-desktop-dependencies -Ddesktop-dependencies=true -Ddesktop-vectors=true -j2
      - name: Run offline GUI contracts without keyboard access
        run: zig build test-editor-frame test-desktop-launch test-desktop-status test-desktop-practice test-desktop-rundown test-desktop-companion test-companion-placement -Ddesktop-dependencies=true -Ddesktop-vectors=true -j2 --test-timeout 180s
