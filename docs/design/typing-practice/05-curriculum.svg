<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='960' viewBox='0 0 1440 960'><g font-family='Helvetica,Arial,sans-serif'><rect x='0' y='0' width='1440' height='960' rx='12' fill='#191D22'/><rect x='0' y='0' width='1440' height='56' rx='12' fill='#23292F'/><text xml:space='preserve' x='28' y='36' font-size='20' fill='#F0F3F7'>Zigmkay   /   Typing practice</text><text xml:space='preserve' x='1075' y='36' font-size='16' fill='#A5B0BD'>E · Adaptive curriculum</text><rect x='32' y='77' width='125' height='44' rx='12' fill='#303740'/><text xml:space='preserve' x='48' y='105' font-size='18' fill='#F0F3F7'>Practice</text><rect x='170' y='77' width='125' height='44' rx='12' fill='#303740'/><text xml:space='preserve' x='186' y='105' font-size='18' fill='#F0F3F7'>Progress</text><text xml:space='preserve' x='1100' y='104' font-size='18' fill='#A5B0BD'>Eurmac · verified layout</text><text xml:space='preserve' x='32' y='177' font-size='36' fill='#F0F3F7'>Learn your layout</text><text xml:space='preserve' x='32' y='209' font-size='18' fill='#A5B0BD'>Difficulty, assistance and exercise length are independent.</text><text xml:space='preserve' x='32' y='931' font-size='18' fill='#A5B0BD'>Design mockup · example data · not a live DVUI screen</text><rect x='32' y='243' width='401' height='645' rx='12' fill='#232A32'/><text xml:space='preserve' x='56' y='283' font-size='25' fill='#F0F3F7'>Your learning path</text><text xml:space='preserve' x='56' y='332' font-size='19' fill='#A5B0BD'>1   Find the keys          Complete</text><rect x='51' y='355' width='363' height='59' rx='12' fill='#29483D'/><text xml:space='preserve' x='56' y='394' font-size='19' fill='#B5EBD3'>2   Build fluency           Current</text><text xml:space='preserve' x='56' y='456' font-size='19' fill='#A5B0BD'>3   Add Shift                 Next</text><text xml:space='preserve' x='56' y='518' font-size='19' fill='#A5B0BD'>4   Change layers</text><text xml:space='preserve' x='56' y='580' font-size='19' fill='#A5B0BD'>5   Combine modifiers</text><text xml:space='preserve' x='56' y='642' font-size='19' fill='#A5B0BD'>6   Use real text</text><text xml:space='preserve' x='56' y='778' font-size='18' fill='#A5B0BD'>Review or choose a stage yourself.</text><rect x='56' y='811' width='348' height='44' rx='12' fill='#303740'/><text xml:space='preserve' x='72' y='839' font-size='18' fill='#F0F3F7'>Choose another stage…</text><rect x='461' y='243' width='947' height='369' rx='12' fill='#232A32'/><text xml:space='preserve' x='485' y='283' font-size='25' fill='#F0F3F7'>Stage 2: Build fluency</text><text xml:space='preserve' x='485' y='323' font-size='18' fill='#A5B0BD'>Current focus: r     ·     Next new character: t</text><text xml:space='preserve' x='485' y='387' font-size='30' fill='#F0F3F7'>e   n   i   a   r   l       + t</text><text xml:space='preserve' x='485' y='439' font-size='18' fill='#A5B0BD'>Accuracy goal reached in 3 runs. Timing needs more practice.</text><rect x='485' y='467' width='875' height='13' rx='12' fill='#39424E'/><rect x='485' y='467' width='610' height='13' rx='12' fill='#55BD8E'/><text xml:space='preserve' x='485' y='523' font-size='18' fill='#A5B0BD'>You can add t now, or let the tutor recommend when to progress.</text><rect x='461' y='638' width='947' height='250' rx='12' fill='#232A32'/><text xml:space='preserve' x='485' y='678' font-size='25' fill='#F0F3F7'>Next exercise</text><rect x='485' y='718' width='250' height='44' rx='12' fill='#303740'/><text xml:space='preserve' x='501' y='746' font-size='18' fill='#F0F3F7'>Guided ▾</text><rect x='753' y='718' width='250' height='44' rx='12' fill='#303740'/><text xml:space='preserve' x='769' y='746' font-size='18' fill='#F0F3F7'>Short · 2 units ▾</text><text xml:space='preserve' x='485' y='817' font-size='18' fill='#A5B0BD'>Readable words · mostly familiar keys · extra r practice</text><rect x='1114' y='718' width='270' height='44' rx='12' fill='#246CF6'/><text xml:space='preserve' x='1130' y='746' font-size='18' fill='#F0F3F7'>Start exercise</text></g></svg>